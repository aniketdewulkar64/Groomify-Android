name: groomify
description: AI-powered personal grooming and style-suggestion desktop application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  
  # Camera & Image Processing
  camera: ^0.11.3
  image: ^4.1.3
  google_mlkit_face_detection: ^0.13.1

  
  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.2.2
  
  # Utilities
  intl: ^0.19.0
  crypto: ^3.0.3
  geolocator: ^13.0.2
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.1
  google_mlkit_face_mesh_detection: ^0.4.1
  gal: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/iconmain1.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/stickers/
    - assets/icons/
